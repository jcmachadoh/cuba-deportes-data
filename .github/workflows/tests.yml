name: tests
on:
  push:
    paths: ["pipeline/**", "config/**", "tests/**", "schemas/**", "pytest.ini", "requirements.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get install -y --no-install-recommends libcairo2 >/dev/null && pip install -r requirements.txt
      - run: pytest -q
