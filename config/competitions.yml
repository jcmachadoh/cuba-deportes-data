  # ------------------------------------------------------------------ VOLEIBOL
  - id: volleyball.superlega
    sport: volleyball
    name: { es: "SuperLega (Italia)" }
    short: SUPERLEGA
    country: IT
    tier: 1
    adapter: legavolley
    # id_campionato por temporada (legavolley.it/classifica/?IdCampionato=...)
    # Sin IdCampionato la página muestra la SuperLega del año indicado (verificado 2025).
    params: { campionati: { "2026-27": 999 } }
    season: { format: split, start_month: 9 }
    active_months: [10, 11, 12, 1, 2, 3, 4, 5]
    history_seasons: 3
    tags: [europe]

