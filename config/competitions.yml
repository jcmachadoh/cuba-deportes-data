# Catálogo de competiciones. Añadir o quitar una liga = editar este archivo.
#
# Campos:
#   id               ID canónico estable (no cambiar una vez publicado)
#   sport            id de config/sports.yml
#   adapter          módulo en pipeline/adapters/
#   params           parámetros propios del adaptador
#   season.format    year  -> etiqueta "2026"
#                    split -> etiqueta "2026-27" (temporadas que cruzan el año)
#   season.start_month  mes en que arranca la temporada (para calcular la actual)
#   active_months    meses con actividad; fuera de ellos el perfil "live" no la consulta
#   history_seasons  cuántas temporadas atrás se rellenan con `backfill`
#   tags             cuba, latam, europe, usa, asia, winter...
#   enabled          false = no se procesa (se documenta el motivo)

competitions:

  # ------------------------------------------------------------------ BÉISBOL
  - id: baseball.snb
    sport: baseball
    name: { es: "Serie Nacional de Béisbol" }
    short: SNB
    country: CU
    tier: 1
    adapter: beisbolcubano
    params: {}
    season: { format: split, start_month: 9 }
    active_months: [10, 11, 12, 1, 2, 3, 4]
    history_seasons: 0          # el sitio solo expone la serie en curso en HTML
    tags: [cuba]
    logo: { url: "https://www.beisbolcubano.cu/images/estilos/snb_c.png", source: beisbolcubano }

  - id: baseball.mlb
    sport: baseball
    name: { es: "Grandes Ligas (MLB)" }
    short: MLB
    country: US
    tier: 1
    adapter: mlb_statsapi
    params: { sport_id: 1, league_ids: [103, 104], roster_type: 40Man }
    season: { format: year, start_month: 3 }
    active_months: [3, 4, 5, 6, 7, 8, 9, 10]
    history_seasons: 5
    tags: [usa]
    logo: { url: "https://www.mlbstatic.com/team-logos/league-on-light/1.svg", source: mlb }

